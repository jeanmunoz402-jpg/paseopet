name: APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['landing/**', '**.md']
concurrency:
  group: apk
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: Llave de firma (se conserva entre compilaciones)
        id: ks
        uses: actions/cache@v4
        with:
          path: android/app/release.jks
          key: paseopet-keystore-v1
      - name: Crear llave si no existe
        if: steps.ks.outputs.cache-hit != 'true'
        run: keytool -genkeypair -keystore android/app/release.jks -alias paseopet -keyalg RSA -keysize 2048 -validity 10000 -storepass paseopet-ks -keypass paseopet-ks -dname "CN=PaseoPet, O=PaseoPet, C=CL"
      - name: Compilar
        working-directory: android
        env: { RUN_NUM: '${{ github.run_number }}' }
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Publicar APK
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk PaseoPet.apk
          SHA=$(keytool -list -v -keystore android/app/release.jks -storepass paseopet-ks | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //')
          echo "SHA256 de la firma: $SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          N=${{ github.run_number }}
          # «Nativa» = última compilación que cambió la parte de Android. La app solo pide
          # reinstalar cuando esta sube; los cambios de la web llegan solos a la APK.
          PREV=$(gh release view apk-latest --json body -q .body 2>/dev/null || true)
          PSHA=$(echo "$PREV" | grep -o 'Commit: [0-9a-f]\{7,40\}' | head -1 | cut -d' ' -f2)
          PNAT=$(echo "$PREV" | grep -o 'Nativa [0-9]*' | head -1 | cut -d' ' -f2)
          PCOMP=$(echo "$PREV" | grep -o 'Compilación [0-9]*' | head -1 | cut -d' ' -f2)
          NAT=$N
          if [ -n "$PSHA" ] && [ -n "$PNAT" ] && git cat-file -e "$PSHA^{commit}" 2>/dev/null; then
            if [ -z "$(git diff --name-only "$PSHA" HEAD -- android)" ]; then NAT=$PNAT; fi
          elif [ -n "$PCOMP" ] && [ -z "$(git diff --name-only HEAD~1 HEAD -- android)" ]; then
            NAT=$PCOMP
          fi
          TITLE=$(git log -1 --pretty=%s | tr -d '"')
          echo "Compilación $N · Nativa $NAT · $TITLE" | tee -a "$GITHUB_STEP_SUMMARY"
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest PaseoPet.apk --title "PaseoPet APK 1.0.$N" --notes "APK de PaseoPet para instalar directo en Android. Compilación $N. Nativa $NAT. Commit: ${GITHUB_SHA:0:12}. Último cambio: $TITLE. SHA256 de la firma: $SHA"
