/* ================= LOOP ================= */
let lastT=performance.now(),acc=0,uiAcc=0,cardAcc=0,trAcc=0;
function loop(t){const dt=Math.min(.1,(t-lastT)/1000);lastT=t;acc+=dt;uiAcc+=dt;
  if(acc>1/12){acc=0;
    if(WK&&!$('#o-live').hidden)drawLive();
    else if(TRK&&!$('#o-track').hidden)drawTrack();
    else if(JOB&&!$('#o-job').hidden)drawJob();
    else if(tab==='map'&&S&&S.onboarded&&$('#o-sum').hidden)drawMapTab();}
  if(uiAcc>.5){uiAcc=0;if(WK){updateLive();updateFloat()}const jt=$('#jobT');if(jt&&JOB){const r=SH.reqWalker.find(x=>x.id===JOB.id);if(r&&r.walkStart)jt.textContent=fmtTime((Date.now()-r.walkStart)/1000)}}
  if(tab==='store'&&document.querySelector('canvas[data-trail]')){trAcc+=dt;if(trAcc>.07){trAcc=0;drawTrailPreviews()}}
  drawFx(dt);cardAcc+=dt;if(cardAcc>.05){animCards(cardAcc);cardAcc=0}requestAnimationFrame(loop)}

/* ================= NAVEGADOR INTERNO (Instagram, TikTok, Facebook…) ================= */
const PUBLIC_URL=(()=>{try{if(window.self===window.top&&/(^|\.)paseopet\.site$|github\.io$/.test(location.hostname))return location.origin+location.pathname}catch(e){}return 'https://paseopet.site/'})();
/* si se abrió sin candado (http) y el certificado ya existe, pasa sola a https */
(function(){try{if(location.protocol==='http:'&&/(^|\.)paseopet\.site$/.test(location.hostname)){fetch('https://'+location.host+location.pathname.replace(/[^/]*$/,'')+'manifest.webmanifest?ping='+Date.now(),{mode:'no-cors',cache:'no-store'}).then(()=>location.replace('https://'+location.host+location.pathname+location.search+location.hash)).catch(()=>{})}}catch(e){}})();
function inAppName(){const u=navigator.userAgent;return /Instagram/i.test(u)?'Instagram':/FBAN|FBAV|FB_IAB|FBIOS|Messenger/i.test(u)?'Facebook':/TikTok|musical_ly|Bytedance/i.test(u)?'TikTok':/WhatsApp/i.test(u)?'WhatsApp':/Line\//i.test(u)?'LINE':/Snapchat/i.test(u)?'Snapchat':/Twitter/i.test(u)?'X':/LinkedInApp/i.test(u)?'LinkedIn':/; wv\)/i.test(u)?'otra app':''}
const isIOS=()=>/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function openOut(url){let ok=false;try{const a=document.createElement('a');a.href=url;a.target='_top';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();ok=true}catch(e){}
  setTimeout(()=>{try{window.top.location.href=url}catch(e){try{window.open(url,'_blank')}catch(e2){}}},350);return ok}
function copyText(t){return(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove()})}
function inAppGate(){return new Promise(resolve=>{const app=inAppName(),ios=isIOS(),ob=$('#ob');ob.hidden=false;$('#nav').hidden=true;
  const host=PUBLIC_URL.replace(/^https:\/\//,'');
  const chrome=`intent://${host}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${encodeURIComponent(PUBLIC_URL)};end`;
  const safari='x-safari-'+PUBLIC_URL;
  ob.innerHTML=`<div class="iag"><img class="login-brand" src="${APP_LOGO}" alt="PaseoPet">
   <div class="box hot col" style="gap:12px;text-align:center"><span class="tag o" style="align-self:center">Estás dentro de ${esc(app)}</span>
    <div class="t2" style="line-height:1.7">Abre PaseoPet en ${ios?'Safari':'Chrome'} para entrar con Gmail</div>
    <div class="mute small">Google no permite iniciar sesión desde el navegador interno de ${esc(app)}, y ahí tampoco funcionan el GPS en segundo plano ni la pantalla completa.</div>
    <button class="btn o big" id="iaOpen">Abrir en ${ios?'Safari':'Chrome'}</button>
    <div class="iasteps"><b>Si no se abre:</b><ol>
      <li>Toca <span class="iak">${ios?'···':'⋮'}</span> arriba a la derecha.</li>
      <li>Elige <b>“${ios?'Abrir en el navegador externo':'Abrir en Chrome'}”</b>${app==='TikTok'?' (o “Abrir en el navegador”)':''}.</li>
      <li>Entra con tu cuenta de Gmail.</li></ol></div>
    <button class="btn" id="iaCopy">Copiar enlace</button><div class="mute small" id="iaMsg">${esc(PUBLIC_URL)}</div>
   </div>
   <div class="iarrow" aria-hidden="true">▲<span>toca ${ios?'···':'⋮'}</span></div>
   <button class="iaskip" id="iaSkip">Seguir aquí de todos modos</button></div>`;
  $('#iaOpen').onclick=()=>{openOut(ios?safari:chrome);$('#iaMsg').textContent='Si no pasó nada, usa el menú '+(ios?'···':'⋮')+' de arriba a la derecha.'};
  $('#iaCopy').onclick=()=>copyText(PUBLIC_URL).then(()=>{$('#iaMsg').textContent='Enlace copiado. Pégalo en '+(ios?'Safari':'Chrome')+'.'});
  $('#iaSkip').onclick=()=>{ob.innerHTML='';resolve()};
  if(!ios&&/Android/i.test(navigator.userAgent)&&!(window.self!==window.top))setTimeout(()=>{try{location.href=chrome}catch(e){}},700);
})}
/* ================= BOOT ================= */
function startApp(){ensureDogs();setTimeout(creatorGrant,1500);setTimeout(angelBirthday,3500);setTimeout(handleFriendLink,600);setTimeout(()=>exitHint(false),2500);updAttr();$('#nav').hidden=false;hydrateIcons($('#nav'));rollDay();save();pushProfile();loadWXCache();go('home');checkResume();fetchWX();gpsPerm().then(st=>{if(st==='granted'&&!gpsBlock())getFix(12000).then(f=>{if(!f.err)fetchWX()})});
  // vaccine reminders
  const soon=S.vacc.filter(v=>v.next&&(new Date(v.next)-new Date(dkey()))/86400000<=7&&(new Date(v.next)-new Date(dkey()))>=0);const key='vac'+dkey();if(soon.length&&S.lastVacNote!==key){S.lastVacNote=key;notify(`Vacuna ${soon[0].n} de ${S.pet.name} el ${soon[0].next}`,'bell')}}
async function boot(){
  $('#ob').hidden=false;
  FBINIT_P=fbInit();
  requestAnimationFrame(loop);
  if(inAppName())await inAppGate();
  await coverScreen();
  const r=await fbBoot();
  DB=r.db;UID=r.uid;MODE='firebase';
  $('#ob').innerHTML=`<div class="splash" style="padding-top:18vh"><img class="login-brand" src="${APP_LOGO}" alt="PaseoPet"><div class="t2 blinktxt">CARGANDO TU MANADA…</div></div>`;
  let snap=null;try{snap=await withTimeout(DB.doc(mainPath()).get(),10000)}catch(e){}
  if(!snap){$('#ob').innerHTML=`<div class="splash" style="padding-top:14vh"><img class="login-brand" src="${APP_LOGO}" alt="PaseoPet"><div class="t2">SIN CONEXIÓN</div><div class="mute small">No pudimos cargar tu manada desde la nube. Revisa tu internet.</div><button class="btn o" id="rl">Reintentar</button></div>`;$('#rl').onclick=()=>location.reload();return}
  if(!snap.exists&&await migrateLocalToCloud()){snap=await DB.doc(mainPath()).get();setTimeout(()=>toast('Trajimos tus datos de este teléfono a tu cuenta de Gmail','star','#2CE6A6'),1500)}
  S=snap&&snap.exists?Object.assign(newState(),snap.data()):newState();S.pet=Object.assign(newState().pet,S.pet);S.walker=Object.assign(newState().walker,S.walker);S.pet.species='perro';S.pet.sex=S.pet.sex||'macho';S.pet.skin=S.pet.skin||'natural';S.pet.aura=S.pet.aura||'default';if(!S.storeGift){S.coins=(S.coins||0)+25;S.storeGift=1;S.econV2=1}if(!S.pet.bid){S.pet.bid=guessBreed(S.pet.breed);S.pet.coat=0;S.pet.custom=!!S.pet.fur&&S.pet.bid==='quiltro'&&S.pet.fur!=='#C98A4B'}if(!S.mapV2){S.mapStyle='nitido';S.mapV2=1}ensureDogs();
  subscribeShared();
  if(S.home)watchChunks(S.home.lat,S.home.lng);
  if(!S.onboarded)startOnboarding();else{$('#ob').hidden=true;startApp()}
}

boot();
