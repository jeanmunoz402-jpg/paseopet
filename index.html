/* Layout: one phone-width game console. Tab screens scroll above a fixed pixel nav; walk, summary, card, tracking and walker job are full overlays. Committed single dark 8-bit look. */
:root{
  --bg:#0B0F1A; --bg2:#10162A; --card:#141A2B; --card2:#1B2340; --line:#2C3660; --fg:#F4F6FB; --mute:#8A93AD;
  --orange:#FF6B2C; --orange2:#B9461A; --violet:#7C5CFF; --violet2:#4E35C2; --mint:#2CE6A6; --mint2:#159A6E; --red:#FF3B5C; --gold:#FFC93C; --blue:#3C9DFF;
  --pix:"PP Pix","Courier New",monospace;
  --body:"PP Texto","Courier New",monospace;--head:"PP Titulo","Courier New",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.3;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
img.spr,canvas.spr{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.app{position:relative;height:100%;max-width:440px;margin:0 auto;overflow:hidden;display:flex;flex-direction:column;
  background:var(--bg) repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 2px,transparent 2px 4px)}
.screens{flex:1;position:relative;min-height:0}
.screen{position:absolute;inset:0;overflow-y:auto;padding-block:14px 110px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen>*,.ov.scroll>*,.sheet>*{flex-shrink:0}
.screen.full{padding:0}
.t1,.t2,.num,.lbl,.btn,.chip,.nav button{font-family:var(--pix)}
.t1{font-size:13px;line-height:1.5;margin:0;letter-spacing:.02em}
.t2{font-size:10px;line-height:1.5;margin:0}
.num{font-variant-numeric:tabular-nums;line-height:1.2}
.lbl{font-size:7px;letter-spacing:.06em;color:var(--mute);text-transform:uppercase;line-height:1.6}
.mute{color:var(--mute)}
.small{font-size:13.5px}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:8px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
/* pixel panel: notched corners + 3px inner border */
.box{--n:6px;background:var(--card);padding:12px;display:flex;flex-direction:column;gap:10px;
  clip-path:polygon(0 var(--n),var(--n) var(--n),var(--n) 0,calc(100% - var(--n)) 0,calc(100% - var(--n)) var(--n),100% var(--n),100% calc(100% - var(--n)),calc(100% - var(--n)) calc(100% - var(--n)),calc(100% - var(--n)) 100%,var(--n) 100%,var(--n) calc(100% - var(--n)),0 calc(100% - var(--n)));
  box-shadow:inset 0 0 0 3px var(--line),inset 0 -6px 0 3px rgba(0,0,0,.18)}
.box.row{flex-direction:row}
.box.hot{box-shadow:inset 0 0 0 3px var(--orange),inset 0 -6px 0 3px rgba(0,0,0,.18)}
.box.vio{box-shadow:inset 0 0 0 3px var(--violet),inset 0 -6px 0 3px rgba(0,0,0,.18)}
.box.dark{background:var(--bg2)}
.btn{--n:4px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 14px;font-size:10px;line-height:1.4;text-transform:uppercase;letter-spacing:.03em;background:var(--card2);color:var(--fg);text-align:center;
  clip-path:polygon(0 var(--n),var(--n) var(--n),var(--n) 0,calc(100% - var(--n)) 0,calc(100% - var(--n)) var(--n),100% var(--n),100% calc(100% - var(--n)),calc(100% - var(--n)) calc(100% - var(--n)),calc(100% - var(--n)) 100%,var(--n) 100%,var(--n) calc(100% - var(--n)),0 calc(100% - var(--n)));
  box-shadow:inset -4px -5px 0 rgba(0,0,0,.4),inset 4px 4px 0 rgba(255,255,255,.12)}
.btn:active{transform:translateY(2px);box-shadow:inset 4px 5px 0 rgba(0,0,0,.4)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.o{background:var(--orange);color:#1A0A02}
.btn.v{background:var(--violet);color:#fff}
.btn.g{background:var(--mint);color:#06281C}
.btn.r{background:var(--red);color:#fff}
.btn.sm{min-height:34px;font-size:8px;padding:0 10px}
.btn.big{min-height:54px;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 9px;font-size:7.5px;line-height:1.3;background:var(--card2);color:var(--fg);white-space:nowrap;box-shadow:inset 0 0 0 2px var(--line)}
.chip.on{background:var(--orange);color:#1A0A02;box-shadow:inset 0 0 0 2px var(--orange)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.chips.wrap{flex-wrap:wrap}
.chips::-webkit-scrollbar{display:none}
/* segmented bar */
.seg{height:16px;background:#0A0E19;box-shadow:inset 0 0 0 2px var(--line);padding:3px;position:relative}
.seg>i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--violet) 0 8px,transparent 8px 10px);transition:width .8s steps(12)}
.seg.o>i{background:repeating-linear-gradient(90deg,var(--orange) 0 8px,transparent 8px 10px)}
.seg.g>i{background:repeating-linear-gradient(90deg,var(--mint) 0 8px,transparent 8px 10px)}
.seg.sm{height:12px;padding:2px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--pix);font-size:8px;color:var(--mute);text-transform:uppercase;line-height:1.5}
.inp{background:#0A0E19;border:0;box-shadow:inset 0 0 0 3px var(--line);padding:10px;font-size:16px;color:var(--fg);width:100%;min-width:0}
.inp:focus{box-shadow:inset 0 0 0 3px var(--gold);outline:none}
textarea.inp{resize:vertical;min-height:84px}
.mini{background:#0D1222;box-shadow:inset 0 0 0 2px var(--line);padding:8px 6px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mini .num{font-size:13px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* nav */
.nav{position:absolute;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));background:var(--bg);box-shadow:0 -3px 0 var(--line)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:6.5px;color:var(--mute);padding:6px 0;text-transform:uppercase}
.nav button img{width:24px;height:24px}
.nav button.on{color:var(--fg)}
.nav .go{position:relative;top:-16px}
.nav .go .ball{width:56px;height:56px;background:var(--orange);display:grid;place-items:center;
  clip-path:polygon(0 8px,8px 8px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 8px) calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 8px),0 calc(100% - 8px));
  box-shadow:inset -5px -6px 0 var(--orange2),inset 5px 5px 0 rgba(255,255,255,.3);animation:hop 1.2s steps(2) infinite}
.nav .go .ball img{width:30px;height:30px}
@keyframes hop{50%{transform:translateY(-3px)}}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-family:var(--pix);font-size:14px;letter-spacing:.02em}
.logo b{color:var(--orange);font-weight:400}

.post .ph{padding:14px 14px 10px;display:flex;align-items:center;gap:10px}
.post .pav{width:44px;height:44px;background:var(--card2);box-shadow:inset 0 0 0 2px var(--line);flex:none;padding:4px}

.post .pb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.pacts{display:flex;gap:16px;align-items:center}

/* manada */
.cos{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cos button{aspect-ratio:1;background:var(--card2);box-shadow:inset 0 0 0 3px var(--line);position:relative;padding:4px;max-width:100%}
.cos button.on{box-shadow:inset 0 0 0 3px var(--orange);background:rgba(255,107,44,.15)}

.cos .lk{position:absolute;top:3px;right:3px;width:14px;height:14px}

.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{padding:10px 4px;text-align:center;background:var(--card2);display:flex;flex-direction:column;gap:6px;align-items:center;font-size:13px;line-height:1.1;box-shadow:inset 0 0 0 3px var(--c,var(--line))}

.album{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.listrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:8px 0;box-shadow:0 2px 0 var(--line)}

.walkrow{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;text-align:left;width:100%;padding:6px;background:var(--bg2);box-shadow:inset 0 0 0 2px var(--line)}

/* sheet */
.sheetwrap{position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;justify-content:flex-end}
.backdrop{position:absolute;inset:0;background:rgba(5,8,16,.75)}
.sheet{position:relative;background:var(--card);box-shadow:0 -4px 0 var(--line);max-height:88%;overflow-y:auto;padding:16px max(14px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .25s steps(4)}

.tl.done{color:var(--fg)}.tl.done i{background:var(--mint)}
.tl.now{color:var(--orange)}.tl.now i{background:var(--orange);animation:bl 1s steps(1) infinite}
.tl span{padding-bottom:10px}
.log{display:flex;flex-direction:column;gap:6px;max-height:170px;overflow-y:auto}
.log div{font-size:15px;padding:7px 9px;background:var(--card2)}
.stars{display:flex;gap:4px}
.stars button{font-family:var(--pix);font-size:24px;color:var(--line);padding:4px}
.stars button.on{color:var(--gold)}
/* onboarding */
.ob{position:absolute;inset:0;z-index:60;background:var(--bg) repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 2px,transparent 2px 4px);overflow-y:auto;padding-block:20px 30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}

.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}

.splash{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding-top:20px}
.blinktxt{animation:bl 1s steps(1) infinite}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{padding:12px;background:var(--card2);box-shadow:inset 0 0 0 3px var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;font-family:var(--pix);font-size:10px}
.choice.on{box-shadow:inset 0 0 0 3px var(--orange);background:rgba(255,107,44,.14)}
.choice img{width:64px;height:64px}
.perm{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center}
.perm img{width:32px;height:32px}
input[type=range]{width:100%;accent-color:var(--orange)}
.banner{padding:10px 12px;font-size:15px;background:rgba(255,201,60,.12);box-shadow:inset 0 0 0 2px var(--gold)}
.wxcard{text-align:left;align-items:center}
.wxcard .wi{width:54px;height:54px;flex:none}

.hours{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}

.hr{flex:none;width:58px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;background:var(--bg2);box-shadow:inset 0 0 0 2px var(--line)}

.dayrow{display:grid;grid-template-columns:62px 30px 1fr auto;gap:8px;align-items:center;padding:7px 0;box-shadow:0 2px 0 var(--line)}
.dayrow:last-child{box-shadow:none}
.dayrow img{width:27px;height:27px}
.diag{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:16px}
/* no accidental text selection on long-press */
.app{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.app input,.app textarea,.app .sel{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button,.btn,.chip,.nav button{touch-action:manipulation}
/* RPG pet card */
.pcard{--n:8px;position:relative;overflow:hidden;padding:16px 14px 26px;isolation:isolate;
  background:radial-gradient(110% 70% at 25% 18%,color-mix(in srgb,var(--ec) 26%,transparent),transparent 62%),linear-gradient(180deg,#1C1646,#0D1124 75%);
  clip-path:polygon(0 var(--n),var(--n) var(--n),var(--n) 0,calc(100% - var(--n)) 0,calc(100% - var(--n)) var(--n),100% var(--n),100% calc(100% - var(--n)),calc(100% - var(--n)) calc(100% - var(--n)),calc(100% - var(--n)) 100%,var(--n) 100%,var(--n) calc(100% - var(--n)),0 calc(100% - var(--n)));
  box-shadow:inset 0 0 0 3px var(--ec),inset 0 0 0 6px #0B0F1A,inset 0 0 0 8px var(--ec2)}
.pcard::before{content:"";position:absolute;inset:-60% -60%;background:linear-gradient(115deg,transparent 46%,rgba(255,255,255,.13) 50%,transparent 54%);animation:shine 5s steps(20) infinite;pointer-events:none;z-index:1}
@keyframes shine{0%{transform:translateX(-45%)}60%,100%{transform:translateX(45%)}}
.pcard .pfx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;image-rendering:pixelated}
.pc-in{position:relative;z-index:3;display:flex;flex-direction:column;gap:12px}
.evob{font-family:var(--pix);font-size:8px;line-height:1.4;padding:6px 8px;background:var(--ec);color:#120C02;box-shadow:inset -3px -3px 0 var(--ec2)}
.pc-stage{position:relative;width:132px;height:132px;flex:none;display:grid;place-items:center}
.pc-stage .petbox{position:relative;z-index:2}
.aura{position:absolute;inset:6px;background:radial-gradient(circle,color-mix(in srgb,var(--ec) 70%,transparent) 0 22%,color-mix(in srgb,var(--ec) 28%,transparent) 42%,transparent 66%);animation:aurap 1.6s steps(3) infinite;z-index:1}
.evo0 .aura{opacity:.25}.evo1 .aura{opacity:.5}.evo2 .aura{opacity:.7}
.evo8 .aura,.evo10 .aura{animation:aurap 1.2s steps(3) infinite}.evo9 .aura,.evo11 .aura{animation:aurap 1.2s steps(3) infinite,hue 4s linear infinite}
.evo5{animation:hueb 6s linear infinite}
/* ===== Perros HD, auras épicas y tarjeta por etapa de evolución ===== */
.evo5{animation:none}
.pcard{--tc:var(--ec);--tc2:var(--ec2)}
.pc-frame{position:absolute;inset:0;pointer-events:none;z-index:2}
.pc-frame::before,.pc-frame::after{content:"";position:absolute;pointer-events:none}
/* esquinas con gemas desde Guardián */
.pc-frame.f5::before,.pc-frame.f6::before,.pc-frame.f7::before,.pc-frame.f8::before,.pc-frame.f9::before,.pc-frame.f10::before,.pc-frame.f11::before{inset:4px;background:
  radial-gradient(circle at 10px 10px,#FFFFFF 0 2px,var(--tc) 3px 6px,#0E0A26 7px 8px,transparent 9px),
  radial-gradient(circle at calc(100% - 10px) 10px,#FFFFFF 0 2px,var(--tc) 3px 6px,#0E0A26 7px 8px,transparent 9px),
  radial-gradient(circle at 10px calc(100% - 10px),#FFFFFF 0 2px,var(--tc) 3px 6px,#0E0A26 7px 8px,transparent 9px),
  radial-gradient(circle at calc(100% - 10px) calc(100% - 10px),#FFFFFF 0 2px,var(--tc) 3px 6px,#0E0A26 7px 8px,transparent 9px)}
/* cresta superior desde Maestro */
.pc-frame.f7::after,.pc-frame.f8::after,.pc-frame.f9::after,.pc-frame.f10::after,.pc-frame.f11::after{left:50%;top:-2px;width:64px;height:16px;transform:translateX(-50%);
  background:linear-gradient(180deg,var(--tc),var(--tc2));clip-path:polygon(0 0,100% 0,82% 100%,62% 55%,50% 100%,38% 55%,18% 100%);filter:drop-shadow(0 0 6px var(--tc))}
/* 0 Cachorro: cartón */
.pcard.evo0:not(.aura-card-rgb){background:radial-gradient(110% 70% at 25% 18%,rgba(154,163,192,.18),transparent 62%),linear-gradient(180deg,#2A2448,#171236 80%);box-shadow:inset 0 0 0 3px #6B7392,inset 0 0 0 6px #0E0A26}
/* 1 Explorador: cuero */
.pcard.evo1:not(.aura-card-rgb){background:radial-gradient(110% 70% at 25% 18%,rgba(217,137,74,.25),transparent 62%),repeating-linear-gradient(135deg,rgba(0,0,0,.08) 0 3px,transparent 3px 7px),linear-gradient(180deg,#3A2418,#1B1230 80%);box-shadow:inset 0 0 0 3px #D9894A,inset 0 0 0 6px #0E0A26,inset 0 0 0 8px #7A4A1E}
/* 2 Aventurero: plata */
.pcard.evo2:not(.aura-card-rgb){background:radial-gradient(110% 70% at 25% 18%,rgba(201,211,232,.28),transparent 62%),linear-gradient(180deg,#2E3050,#151230 80%);box-shadow:inset 0 0 0 3px #E3E9F6,inset 0 0 0 6px #0E0A26,inset 0 0 0 9px #8C96B4,inset 0 0 0 11px #0E0A26}
/* 3 Rastreador: bosque */
.pcard.evo3:not(.aura-card-rgb){background:radial-gradient(110% 70% at 25% 18%,rgba(79,209,139,.28),transparent 62%),radial-gradient(circle at 85% 90%,rgba(44,230,166,.18),transparent 40%),linear-gradient(180deg,#183A36,#121230 80%);box-shadow:inset 0 0 0 3px #4FD18B,inset 0 0 0 6px #0E0A26,inset 0 0 0 9px #2A8F5C,inset 0 0 0 11px #0E0A26}
/* 4 Héroe: oro */
.pcard.evo4:not(.aura-card-rgb){background:radial-gradient(110% 70% at 25% 18%,rgba(255,201,60,.32),transparent 62%),linear-gradient(180deg,#3A2C14,#1A1236 80%);box-shadow:inset 0 0 0 3px #FFE29A,inset 0 0 0 6px #0E0A26,inset 0 0 0 9px #FFC93C,inset 0 0 0 11px #0E0A26,0 0 18px rgba(255,201,60,.25)}

.seg.xpbar{height:18px}
.seg.xpbar i{position:relative;background:repeating-linear-gradient(90deg,#9C84FF 0 8px,transparent 8px 10px)}
.seg.xpbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:xps 1.8s steps(10) infinite}

.evotrack{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}

.attrs{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.pattr{display:grid;grid-template-columns:28px 1fr 22px;gap:6px;align-items:center}
.medals{display:flex;align-items:center;gap:6px;padding:8px;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 2px var(--line);width:100%;text-align:left;min-width:0}

.evoov{position:absolute;inset:0;z-index:96;background:rgba(5,6,14,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
.evostage{position:relative;width:150px;height:150px;display:grid;place-items:center}

.evonew{position:absolute;inset:0;display:grid;place-items:center;opacity:0;animation:evin 2.6s steps(12) forwards}

/* post-walk flow */
.steps3{display:flex;gap:4px;flex:1;min-width:0}

.steps3 span.on{background:var(--orange);color:#1A0A02;box-shadow:none}
.postfoot{position:sticky;bottom:-40px;z-index:5;padding:14px 0 40px;margin-bottom:-40px;background:linear-gradient(180deg,transparent,var(--bg) 35%);display:grid;gap:8px}

.check{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;padding:8px 0;box-shadow:0 2px 0 var(--line)}

.breeds{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:270px;overflow-y:auto;padding:2px;scrollbar-width:thin}

.steps3.soct{flex:none}

/* ===== v2: epic polish ===== */
.app::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background-image:radial-gradient(1px 1px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 78% 12%,#C9BDFF,transparent),radial-gradient(1px 1px at 42% 62%,#fff,transparent),radial-gradient(1px 1px at 88% 48%,#2CE6A6,transparent),radial-gradient(1px 1px at 22% 82%,#FFC93C,transparent),radial-gradient(1px 1px at 63% 32%,#fff,transparent),radial-gradient(1px 1px at 8% 52%,#fff,transparent),radial-gradient(1px 1px at 54% 90%,#fff,transparent);
  animation:twk 3s steps(2) infinite}

.screens{z-index:1}
.nav{box-shadow:0 -3px 0 var(--line),0 -6px 0 rgba(124,92,255,.18)}
.hdr{display:flex;align-items:center;gap:8px}
.hdr .logo{display:flex;align-items:center;gap:8px;flex:1;min-width:0}

/* settings */
.setrow{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 0;box-shadow:0 2px 0 var(--line);width:100%;text-align:left}

.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.mission.done .mic{background:rgba(44,230,166,.15);box-shadow:inset 0 0 0 2px var(--mint)}
.mission.done .mic img{animation:mbob 1s steps(2) infinite}
/* donate */
.heartbig{width:96px;height:96px;margin:0 auto;animation:beat 1s steps(2) infinite}
/* weather animated backgrounds */
.wxcard{position:relative;overflow:hidden;isolation:isolate}
.wxcard>*:not(.wxbg){position:relative;z-index:2}
.wxbg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.wxbg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,15,26,.05),rgba(11,15,26,.72) 52%);z-index:3}
.wxbg i{position:absolute;display:block}
.wxk-sun .wxbg{background:linear-gradient(180deg,#1E5FC2,#3E8BEA 60%,#F2B44A)}
.wxk-sun .wxbg i:nth-child(1),.wxk-partly .wxbg i:nth-child(1){left:-22px;top:-22px;width:110px;height:110px;border-radius:50%;background:repeating-conic-gradient(rgba(255,222,120,.45) 0 12deg,transparent 12deg 30deg);animation:spin 14s steps(48) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wxk-partly .wxbg{background:linear-gradient(180deg,#2B5FA8,#5A8ED0)}
.wxk-cloud .wxbg{background:linear-gradient(180deg,#3A4660,#5E6B86)}
.wxk-partly .wxbg i:nth-child(2),.wxk-cloud .wxbg i:nth-child(1),.wxk-cloud .wxbg i:nth-child(2){width:56px;height:40px;background:var(--cloud) center/contain no-repeat;image-rendering:pixelated;opacity:.75;top:6px;left:40%;animation:drift 9s steps(30) infinite alternate}
.wxk-cloud .wxbg i:nth-child(2){top:44px;left:62%;width:44px;height:30px;animation-duration:13s;opacity:.5}
@keyframes drift{to{transform:translateX(-60px)}}
.wxk-night .wxbg{background:linear-gradient(180deg,#070B22,#1A1F4A)}
.wxk-night .wxbg i:nth-child(1){inset:0;background-image:radial-gradient(1.5px 1.5px at 30% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 55% 60%,#fff,transparent),radial-gradient(1px 1px at 70% 30%,#FFC93C,transparent),radial-gradient(1.5px 1.5px at 85% 75%,#fff,transparent),radial-gradient(1px 1px at 45% 85%,#C9BDFF,transparent),radial-gradient(1.5px 1.5px at 92% 15%,#fff,transparent);animation:twk 1.6s steps(2) infinite}
.wxk-rain .wxbg,.wxk-storm .wxbg{background:linear-gradient(180deg,#1C2740,#344566)}
.wxk-rain .wxbg i:nth-child(1),.wxk-storm .wxbg i:nth-child(1){inset:-40px;background:repeating-linear-gradient(105deg,transparent 0 16px,rgba(160,205,255,.55) 16px 18px);animation:rain .45s steps(4) infinite}
@keyframes rain{to{transform:translate(-10px,36px)}}
.wxk-storm .wxbg i:nth-child(2){inset:0;background:#fff;opacity:0;animation:flash 4.5s steps(1) infinite}
@keyframes flash{0%,66%,70%,74%,100%{opacity:0}68%{opacity:.55}72%{opacity:.35}}
.wxk-snow .wxbg{background:linear-gradient(180deg,#34425E,#76869F)}
.wxk-snow .wxbg i:nth-child(1){inset:-40px;background-image:radial-gradient(#fff 1.5px,transparent 2px),radial-gradient(#fff 1px,transparent 1.5px);background-size:22px 22px,14px 14px;background-position:0 0,7px 9px;animation:snow 2.4s steps(12) infinite}
@keyframes snow{to{transform:translate(8px,22px)}}
.wxk-fog .wxbg{background:linear-gradient(180deg,#465066,#6C7488)}
.wxk-fog .wxbg i:nth-child(1),.wxk-fog .wxbg i:nth-child(2){inset:0 -60px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.16) 0 6px,transparent 6px 16px);animation:fogm 6s steps(20) infinite alternate}
.wxk-fog .wxbg i:nth-child(2){top:8px;opacity:.6;animation-duration:9s}
@keyframes fogm{to{transform:translateX(40px)}}
.wxi{filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.wxk-sun .wxi,.wxk-night .wxi{animation:mbob 1.6s steps(2) infinite}
.wxk-rain .wxi,.wxk-snow .wxi,.wxk-cloud .wxi,.wxk-partly .wxi,.wxk-fog .wxi{animation:wxsway 2s steps(4) infinite}
.wxk-storm .wxi{animation:shake .5s steps(2) infinite}
@keyframes wxsway{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
@keyframes shake{50%{transform:translate(2px,-1px)}}
/* social IG */
.stories{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;width:66px;font-size:12px;min-width:0}
.story .sr{width:62px;height:62px;padding:3px;background:conic-gradient(from 200deg,#FFC93C,#FF6B2C,#FF3B5C,#7C5CFF,#FFC93C)}
.story .sr.seen{background:var(--line)}
.story .sr>div{width:100%;height:100%;background:var(--card2);box-shadow:0 0 0 3px var(--bg);display:grid;place-items:center;position:relative}
.story .sr img{width:44px;height:44px}
.story .plus{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;background:var(--orange);color:#1A0A02;font-family:var(--pix);font-size:12px;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
.story span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.scard{flex:none;width:132px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;background:var(--card2);box-shadow:inset 0 0 0 2px var(--line);text-align:center}
.scard .t2{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.igp{background:var(--card);box-shadow:inset 0 0 0 2px var(--line)}
.igp header{display:flex;align-items:center;gap:10px;padding:10px 12px}
.igav{width:40px;height:40px;padding:2px;background:conic-gradient(#FFC93C,#FF6B2C,#7C5CFF,#FFC93C);flex:none}
.igav>span{display:grid;place-items:center;width:100%;height:100%;background:var(--card2);box-shadow:0 0 0 2px var(--card)}
.igav img{width:30px;height:30px}
.igp .media{position:relative;width:100%;max-width:100%;aspect-ratio:1/1;background:#0E1322;user-select:none;overflow:hidden}
.igp .media canvas,.igp .media img.ph2{width:100%;height:100%;display:block;object-fit:cover;image-rendering:pixelated}
.igp .media .ov2{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:6px}
.igp .media .ov2 .pill{flex:1;flex-direction:column;gap:4px;justify-content:center;text-align:center}
.igacts{display:flex;align-items:center;gap:16px;padding:10px 12px 4px}
.igacts button{display:flex;align-items:center;gap:5px;font-family:var(--pix);font-size:9px}
.igacts img{width:24px;height:24px}
.igacts .on{color:var(--orange)}
.igbody{padding:4px 12px 12px;display:flex;flex-direction:column;gap:5px}
.igbody .cap b{margin-right:6px}
.igbody .lnk{color:var(--mute);text-align:left;font-size:14px}
.xgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}
.xgrid button{position:relative;aspect-ratio:1;background:#0E1322;overflow:hidden;max-width:100%;min-width:0}
.xgrid img,.xgrid canvas{width:100%;height:100%;object-fit:cover;display:block;image-rendering:pixelated}
.xgrid .xk{position:absolute;left:4px;bottom:4px;font-family:var(--pix);font-size:7px;background:rgba(11,15,26,.8);padding:3px 4px}
.pf-head{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.pf-counts{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:4px}
.pf-counts b{font-family:var(--pix);font-size:13px;display:block}
.pf-counts span{font-size:12px;color:var(--mute)}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:6px;text-align:center}
.podium>button{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.podium .pd{width:100%;display:grid;place-items:center;font-family:var(--pix);font-size:14px;color:#1A1020}
.podium .pdn{font-size:12.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* story viewer */
.sv{position:absolute;inset:0;z-index:92;background:#000;display:flex;flex-direction:column;user-select:none}
.sv .bars{display:flex;gap:4px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 6px}
.sv .bars i{flex:1;height:3px;background:rgba(255,255,255,.3);position:relative;overflow:hidden}
.sv .bars i b{position:absolute;inset:0;background:#fff;transform-origin:left;transform:scaleX(0)}
.sv .sh{display:flex;align-items:center;gap:10px;padding:4px 12px}
.sv .sh img{width:34px;height:34px;background:var(--card2)}

.sv .sc img.ph,.sv .sc canvas{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.sv .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:15px}
.sv .tapL,.sv .tapR{position:absolute;top:0;bottom:0;width:35%;z-index:2}
.sv .tapL{left:0}.sv .tapR{right:0}

/* cover & transiciones de inicio */
.ob.obc{padding:0;overflow:hidden}

.cover canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
.cv-ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(28px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));text-align:center;z-index:2}
.cv-top{display:flex;flex-direction:column;align-items:center;gap:10px;animation:cvfloat 2.4s steps(4) infinite}
@keyframes cvfloat{50%{transform:translateY(-5px)}}
.cv-paw{width:40px;height:40px;filter:drop-shadow(0 0 10px #FF6B2C)}
.cv-brand{width:clamp(165px,46vw,215px);height:auto;display:block;filter:drop-shadow(0 6px 0 #1A1040) drop-shadow(0 0 22px rgba(255,122,77,.55));user-select:none;-webkit-user-drag:none}
.login-brand{width:clamp(145px,40vw,185px);height:auto;display:block;margin:0 auto;filter:drop-shadow(0 5px 0 #0E0A26) drop-shadow(0 0 18px rgba(255,201,60,.4));animation:cvfloat 2.4s steps(4) infinite;user-select:none;-webkit-user-drag:none}
.hdr .logo img.hdr-brand{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 2px 0 #0E0A26)}
.cv-logo{font-family:var(--pix);font-size:clamp(28px,10vw,42px);line-height:1;letter-spacing:.02em;color:#F4F6FB;text-shadow:4px 4px 0 #4E35C2,8px 8px 0 #1A1040,0 0 24px rgba(156,132,255,.6)}
.cv-logo .o{color:#FF6B2C;text-shadow:4px 4px 0 #8A2A0A,8px 8px 0 #1A1040,0 0 24px rgba(255,107,44,.7)}
.cv-sub{font-family:var(--pix);font-size:8.5px;line-height:1.6;color:#FFC93C;text-shadow:2px 2px 0 #1A1040;padding:6px 10px;background:rgba(11,8,32,.55);box-shadow:inset 0 0 0 2px rgba(255,201,60,.5)}
.cv-req{font-family:var(--pix);font-size:8px;line-height:1.5;color:#2CE6A6;background:rgba(11,8,32,.78);padding:7px 12px;box-shadow:inset 0 0 0 2px #2CE6A6,0 4px 0 #0E0A26;letter-spacing:.04em}
.cv-btns{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.cv-main{min-height:64px;font-size:11px;animation:cvpulse 1.2s steps(2) infinite;box-shadow:inset -4px -5px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.25),0 0 0 3px #1A1040,0 0 24px rgba(255,107,44,.65)}
@keyframes cvpulse{50%{transform:scale(1.03)}}
.cv-start{color:#FFC93C;text-shadow:2px 2px 0 #1A1040}
.cv-foot{font-size:12px;color:rgba(244,246,251,.6)}
.cv-sign{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 14px;background:rgba(11,8,32,.6);box-shadow:inset 0 0 0 2px rgba(255,201,60,.45)}
.cv-sign span{font-family:var(--pix);font-size:6.5px;letter-spacing:.08em;color:rgba(244,246,251,.7)}
.cv-sign b{font-family:var(--pix);font-size:10px;line-height:1.4;color:#FFC93C;text-shadow:2px 2px 0 #8A2A0A,0 0 12px rgba(255,201,60,.5);font-weight:400}
.cover.cv-exit{animation:cvExit .58s cubic-bezier(.4,0,.2,1) forwards;pointer-events:none}

.scr-wipe::before,.scr-wipe::after{content:"";display:block;width:100%;height:52%;background:#120E30;box-shadow:0 0 0 4px #FFC93C,0 0 28px rgba(255,122,77,.85);animation:wipeHalf .72s steps(10) forwards}
.scr-wipe::after{transform-origin:bottom;box-shadow:0 0 0 4px #FF7A4D,0 0 28px rgba(255,201,60,.85)}
@keyframes wipeHalf{0%{transform:scaleY(0)}42%{transform:scaleY(1)}62%{transform:scaleY(1)}100%{transform:scaleY(0)}}
.login-scr{animation:scrEnter .52s cubic-bezier(.22,1,.36,1) both;width:100%;max-width:390px;margin:0 auto}
@keyframes scrEnter{0%{opacity:0;transform:translateY(28px) scale(.94);filter:brightness(1.5)}100%{opacity:1;transform:translateY(0) scale(1);filter:brightness(1)}}
.g-btn{width:100%;min-height:60px;background:#FFFFFF!important;color:#1F1F1F!important;gap:12px;font-size:11px;box-shadow:inset -3px -4px 0 #D0D5DD,inset 3px 3px 0 #FFFFFF,0 0 0 3px #0E0A26,0 5px 0 #0E0A26,0 0 22px rgba(255,201,60,.35)!important}
.g-btn:active{transform:translateY(3px)}

.empty{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 10px}
.empty img{width:54px;height:54px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ===== Rediseño v3: ventanas RPG al crepúsculo (frontend-design) =====
   Paleta: noche #17123A · ventana #251E5C · luna #F6EAC8 · coral #FF7A4D · pasto #4FD18B · ciruela #9A6BFF · oro #FFC93C
   Tipo: Press Start 2P solo para títulos y cifras; Pixelify Sans para todo lo que se lee. Etiquetas en minúscula.
   Lo memorable: la ficha del perro. Todo lo demás, ventanas tranquilas y consistentes. */
:root{
  --bg:#17123A; --bg2:#1D1748; --card:#241D58; --card2:#2C2468; --line:#4A3F8F; --fg:#F6EAC8; --mute:#B2A9D9;
  --orange:#FF7A4D; --orange2:#B8452A; --violet:#9A6BFF; --violet2:#5B3DC4; --mint:#4FD18B; --mint2:#2A8F5C; --red:#FF4F6A; --gold:#FFC93C; --blue:#7EA6FF;
  --moon:#F6EAC8; --moon2:#C9B98F;
}
body{background:var(--bg)}
.app{background:linear-gradient(180deg,#120E30 0%,#17123A 40%,#1D1546 100%)}
.app::before{opacity:.4}
/* ventanas: borde crema doble como cuadro de diálogo de RPG */
.box{background:linear-gradient(180deg,#2A2266 0%,#211A55 100%);box-shadow:inset 0 0 0 2px #0E0A26,inset 0 0 0 4px var(--moon),inset 0 0 0 6px #0E0A26,inset 0 -8px 0 6px rgba(0,0,0,.18);padding:16px}
.box.dark{background:#1A1446;box-shadow:inset 0 0 0 2px var(--line)}
.box.hot{box-shadow:inset 0 0 0 2px #0E0A26,inset 0 0 0 4px var(--orange),inset 0 0 0 6px #0E0A26}
.box.vio{box-shadow:inset 0 0 0 2px #0E0A26,inset 0 0 0 4px var(--violet),inset 0 0 0 6px #0E0A26}
.box .t2:first-child{color:var(--moon)}
/* títulos y etiquetas: sin mayúsculas forzadas */
.lbl{font-family:var(--body);font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--mute);line-height:1.3}
.t1{color:var(--moon);text-shadow:2px 2px 0 #0E0A26}
.t2{font-size:9.5px;color:var(--moon)}
.small{font-size:14px}
.mute{color:var(--mute)}
/* botones con bisel y sombra dura */
.btn{background:#3A3180;color:var(--moon);text-transform:none;letter-spacing:0;box-shadow:inset -3px -4px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.12),0 4px 0 #0E0A26}
.btn:active{transform:translateY(3px);box-shadow:inset 3px 4px 0 rgba(0,0,0,.35),0 1px 0 #0E0A26}
.btn.o{background:var(--orange);color:#2A0E04}
.btn.v{background:var(--violet);color:#120A30}
.btn.g{background:var(--mint);color:#06281C}
.btn.r{background:var(--red);color:#fff}
.chip{font-family:var(--body);font-size:13px;text-transform:none;padding:7px 12px;background:#2C2468;color:var(--moon);box-shadow:inset 0 0 0 2px var(--line)}
.chip.on{background:var(--moon);color:#17123A;box-shadow:inset 0 0 0 2px var(--moon)}
.tag{font-family:var(--body);font-size:12px;text-transform:none;padding:4px 8px}
.inp{background:#120E30;box-shadow:inset 0 0 0 2px var(--line),inset 0 3px 0 rgba(0,0,0,.35);color:var(--moon)}
.inp:focus{box-shadow:inset 0 0 0 2px var(--gold)}
.mini{background:#1A1446;box-shadow:inset 0 0 0 2px #3A3180}
.mini .lbl{font-size:11.5px}
.seg{background:#120E30;box-shadow:inset 0 0 0 2px #3A3180}
/* barra inferior como consola */
.nav{background:linear-gradient(180deg,#221B57,#17123A);box-shadow:0 -2px 0 #0E0A26,0 -4px 0 var(--moon),0 -6px 0 #0E0A26}
.nav button{font-family:var(--body);font-size:11px;text-transform:none;color:var(--mute)}
.nav button.on{color:var(--moon)}
.nav button.on:not(.go)::after{content:"";display:block;width:18px;height:3px;background:var(--orange);margin-top:-2px}
.nav .go .ball{background:var(--orange);box-shadow:inset -5px -6px 0 var(--orange2),inset 5px 5px 0 rgba(255,255,255,.3),0 0 0 3px #0E0A26,0 0 0 6px var(--moon)}
/* pestañas tipo menú de juego */
.soct button,.steps3 span{font-family:var(--body);font-size:12.5px;text-transform:none;background:#2C2468;color:var(--mute);box-shadow:inset 0 0 0 2px var(--line)}
.soct button.on,.steps3 span.on{background:var(--moon);color:#17123A;box-shadow:none}
/* toasts como globo de diálogo */
.toast{background:#211A55;color:var(--moon);box-shadow:inset 0 0 0 2px #0E0A26,inset 0 0 0 4px var(--moon),4px 4px 0 rgba(0,0,0,.5)}
.banner{background:rgba(255,201,60,.1);box-shadow:inset 0 0 0 2px var(--gold);color:var(--moon)}
.sheet{background:linear-gradient(180deg,#2A2266,#1D1748);box-shadow:0 -2px 0 #0E0A26,0 -4px 0 var(--moon),0 -6px 0 #0E0A26}
.sheet::before{content:"";display:block;width:44px;height:5px;background:var(--moon);opacity:.5;margin:0 auto -4px}
/* cabecera */
.hdr .logo{font-size:13px;color:var(--moon)}
.iconbtn{background:#2C2468;box-shadow:inset 0 0 0 2px var(--line),0 3px 0 #0E0A26}
/* paneles del paseo */
.panel{background:linear-gradient(180deg,#2A2266,#1D1748);box-shadow:0 -2px 0 #0E0A26,0 -4px 0 var(--moon),0 -6px 0 #0E0A26}
.pill{font-family:var(--body);font-size:12px;text-transform:none;background:rgba(23,18,58,.9);color:var(--moon)}
.events button{background:#2C2468;box-shadow:inset 0 0 0 2px var(--line),0 3px 0 #0E0A26}
/* la ficha del perro sigue siendo la estrella */
.pcard{box-shadow:inset 0 0 0 3px var(--ec),inset 0 0 0 6px #0E0A26,inset 0 0 0 9px var(--moon),inset 0 0 0 11px #0E0A26}
.evob{font-family:var(--pix);font-size:8px}
.pcard .lbl{color:#D6CCF5}
/* medallas / colección */
.mdl .mr{font-family:var(--body);font-size:11px;text-transform:none}
.mdl{box-shadow:inset 0 0 0 2px #0E0A26,inset 0 0 0 4px var(--ec),inset 0 -5px 0 4px rgba(0,0,0,.25)}
/* ajustes */
.setrow{box-shadow:0 2px 0 rgba(246,234,200,.12)}
.setrow .chev{color:var(--moon2)}
/* clima: un poco más de contraste */
.wxbg::after{background:linear-gradient(90deg,rgba(23,18,58,.05),rgba(23,18,58,.78) 52%)}

/* bienestar */
.vitals{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.vit{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center}
.vit b{font-family:var(--pix);font-size:9px;min-width:34px;text-align:right}
.coins{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--gold)}
.coins img{width:20px;height:20px}.coins b{font-family:var(--pix);font-size:10px}

/* aviso navegador interno */
.iag{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 4px;position:relative}
.iag .login-brand{width:min(190px,52vw)}
.iasteps{text-align:left;font-size:15px;line-height:1.5;background:rgba(0,0,0,.25);padding:10px 12px;box-shadow:inset 0 0 0 2px var(--line)}
.iasteps ol{margin:6px 0 0;padding-left:20px}
.iak{font-family:var(--pix);font-size:11px;padding:2px 6px;background:var(--moon);color:#17123A}
.iarrow{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));right:14px;font-family:var(--pix);font-size:16px;color:var(--gold);display:flex;flex-direction:column;align-items:flex-end;gap:4px;animation:mbob 1s steps(2) infinite;pointer-events:none;z-index:99}
.iarrow span{font-size:8px}
.iaskip{font-size:13px;color:var(--mute);text-decoration:underline;padding:8px}
/* ===== v4 · ARCADE DE BARRIO — segundo aire de la UI =====
   Teclas de consola con relieve, paneles limpios con brillo superior, dock flotante con PASEAR como moneda gigante.
   La estrella es el mapa del paseo: anillo de alcance + faros de botín. Todo lo demás, sobrio y legible. */
:root{--deep:#0E0A26;--face:#2B2370;--face2:#1E1852;--edge:#4A3F9A;--coral:#FF7A4D;--mint2:#2CE6A6;--glow:rgba(255,122,77,.55)}
/* ---------- paneles ---------- */
.box{--n:8px;background:linear-gradient(180deg,#2D2575 0%,#231C5E 55%,#1D174F 100%);box-shadow:inset 0 0 0 2px var(--deep),inset 0 0 0 4px var(--edge),inset 0 6px 0 4px rgba(255,255,255,.06),inset 0 -8px 0 2px rgba(0,0,0,.22);padding:16px}
.box.dark{background:linear-gradient(180deg,#1C1650,#16113F);box-shadow:inset 0 0 0 2px var(--deep),inset 0 0 0 4px #33297A}
.box.hot{box-shadow:inset 0 0 0 2px var(--deep),inset 0 0 0 4px var(--coral),inset 0 6px 0 4px rgba(255,122,77,.12),inset 0 -8px 0 2px rgba(0,0,0,.22)}
.box.vio{box-shadow:inset 0 0 0 2px var(--deep),inset 0 0 0 4px var(--violet),inset 0 6px 0 4px rgba(154,107,255,.12),inset 0 -8px 0 2px rgba(0,0,0,.22)}
.mini{background:linear-gradient(180deg,#1E1854,#17123F);box-shadow:inset 0 0 0 2px #3A3088,inset 0 3px 0 rgba(255,255,255,.05)}
/* ---------- botones: teclas de consola ---------- */
.btn{--n:6px;min-height:46px;background:linear-gradient(180deg,#4F44AE 0%,#3A3090 100%);color:#F6EAC8;font-family:var(--pix);font-size:9.5px;letter-spacing:.02em;text-transform:none;
  box-shadow:inset 0 0 0 2px var(--deep),inset 0 3px 0 2px rgba(255,255,255,.22),inset 0 -6px 0 2px rgba(0,0,0,.32);transition:transform .08s steps(2),filter .12s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:inset 0 0 0 2px var(--deep),inset 0 2px 0 2px rgba(0,0,0,.3)}
.btn.o{background:linear-gradient(180deg,#FFA078 0%,#FF7A4D 45%,#F05F2E 100%);color:#2A0E04}
.btn.g{background:linear-gradient(180deg,#7BEFB8 0%,#3FD38E 50%,#27B874 100%);color:#04261A}
.btn.v{background:linear-gradient(180deg,#C2A6FF 0%,#9A6BFF 50%,#7B4FE8 100%);color:#140A33}
.btn.r{background:linear-gradient(180deg,#FF8A9D 0%,#FF4F6A 50%,#E0334F 100%);color:#fff}
.btn.big{min-height:58px;font-size:11.5px}
.btn.sm{min-height:36px;font-size:8.5px}
.btn.o.big,.btn.g.big{background-image:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.45) 50%,transparent 62%),var(--bgf,linear-gradient(180deg,#FFA078 0%,#FF7A4D 45%,#F05F2E 100%));background-size:260% 100%,100% 100%;animation:keyShine 3.2s linear infinite}
.btn.g.big{--bgf:linear-gradient(180deg,#7BEFB8 0%,#3FD38E 50%,#27B874 100%)}
@keyframes keyShine{0%{background-position:130% 0,0 0}55%,100%{background-position:-130% 0,0 0}}
.btn:disabled{filter:grayscale(.6) brightness(.8)}
.iconbtn{background:linear-gradient(180deg,#352C86,#271F66);box-shadow:inset 0 0 0 2px var(--deep),inset 0 2px 0 2px rgba(255,255,255,.12),inset 0 -4px 0 2px rgba(0,0,0,.3)}
.iconbtn:active{transform:translateY(2px)}
/* ---------- chips y pestañas: píldoras ---------- */
.chip{border-radius:999px;padding:8px 14px;font-family:var(--body);font-size:13.5px;font-weight:600;background:#241D5E;color:#D9D0FF;box-shadow:inset 0 0 0 2px #3D3394}
.chip.on{background:linear-gradient(180deg,#FFA078,#FF7A4D);color:#2A0E04;box-shadow:inset 0 0 0 2px var(--deep),0 0 14px var(--glow)}
.soct button,.steps3 span{border-radius:999px;font-weight:600}
.soct button.on,.steps3 span.on{background:linear-gradient(180deg,#FFF6D8,#F6EAC8);color:#17123A;box-shadow:inset 0 0 0 2px var(--deep)}
.tag,.rtag{border-radius:6px}
/* ---------- títulos ---------- */
.t1{background:linear-gradient(180deg,#FFF6D8 0%,#FFE29A 55%,#FFC93C 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(2px 2px 0 #0E0A26)}
/* ---------- avisos: globo con rebote ---------- */
.toast{border-radius:14px;background:linear-gradient(180deg,#2D2575,#211A5A);box-shadow:inset 0 0 0 2px var(--deep),inset 0 0 0 4px #F6EAC8,0 8px 0 rgba(0,0,0,.35);animation:toastIn .32s cubic-bezier(.2,1.6,.4,1)}
.toast img{background:#17123A;border-radius:8px;padding:3px;box-shadow:inset 0 0 0 2px #3D3394}
@keyframes toastIn{from{transform:translateY(-18px) scale(.9);opacity:0}}
/* ---------- cambio de pestaña ---------- */
.screen:not([hidden]){animation:scrIn .24s steps(4)}
@keyframes scrIn{from{opacity:0;transform:translateY(10px)}}
/* ---------- hojas ---------- */
.sheet{border-radius:22px 22px 0 0;background:linear-gradient(180deg,#2D2575,#1B1549);box-shadow:inset 0 0 0 2px var(--deep),inset 0 0 0 4px var(--edge),0 -10px 30px rgba(0,0,0,.45)}
.sheet::before{width:52px;height:6px;border-radius:6px;background:#F6EAC8;opacity:.55}
/* ---------- DOCK inferior ---------- */
.nav{margin:0 10px calc(8px + env(safe-area-inset-bottom,0px));padding:6px 6px 6px;gap:2px;border-radius:20px;overflow:visible;
  background:linear-gradient(180deg,#2E2578,#1C1650);box-shadow:inset 0 0 0 2px var(--deep),inset 0 0 0 4px var(--edge),inset 0 6px 0 4px rgba(255,255,255,.06),0 10px 24px rgba(0,0,0,.45)}
.nav button,.nav button.on,.nav .go,.nav .go.on{background:none!important;box-shadow:none!important;transform:none;color:#A79FD9;font-family:var(--body);font-size:11.5px;font-weight:600;text-transform:none;padding:3px 0 2px;gap:2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.nav button::after{display:none!important}
.nav .nb{width:42px;height:34px;display:grid;place-items:center;border-radius:10px;transition:transform .16s cubic-bezier(.2,1.6,.4,1)}
.nav .nb img{width:24px;height:24px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4))}
.nav button.on{color:#FFF6D8}
.nav button.on .nb{background:linear-gradient(180deg,#FFA078,#FF7A4D 55%,#F05F2E);box-shadow:inset 0 0 0 2px var(--deep),inset 0 2px 0 2px rgba(255,255,255,.3),inset 0 -4px 0 2px rgba(0,0,0,.25),0 0 16px var(--glow);transform:translateY(-5px)}
.nav .go .nb{width:62px;height:62px;margin-top:-30px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#FFC1A3 0,#FF7A4D 42%,#D9461C 100%);
  box-shadow:0 0 0 3px var(--deep),0 0 0 7px #FFC93C,0 0 0 10px var(--deep),0 0 26px var(--glow);animation:goBeat 1.4s ease-in-out infinite}
.nav .go .nb img{width:32px;height:32px}
.nav .go .nl{position:relative;z-index:2;color:#FFC93C;font-family:var(--pix);font-size:8px;margin-top:9px;text-shadow:1px 1px 0 #0E0A26}
.nav .go.on .nb{transform:none}
@keyframes goBeat{0%,100%{transform:scale(1)}12%{transform:scale(1.08)}24%{transform:scale(1)}36%{transform:scale(1.05)}}
/* ---------- paseo en vivo: HUD ---------- */
.pill{border-radius:999px;background:rgba(23,18,58,.88);box-shadow:inset 0 0 0 2px #3D3394;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.panel{border-radius:24px 24px 0 0;background:linear-gradient(180deg,#2D2575,#1B1549);box-shadow:inset 0 0 0 2px var(--deep),inset 0 0 0 4px var(--edge),0 -10px 30px rgba(0,0,0,.4)}
.panel::before{content:"";display:block;width:46px;height:5px;border-radius:5px;background:#F6EAC8;opacity:.4;margin:-4px auto 0}
.bigtime{font-size:34px;background:linear-gradient(180deg,#FFFFFF,#FFE29A);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(3px 3px 0 #0E0A26)}
.events button{border-radius:12px;background:linear-gradient(180deg,#352C86,#271F66);box-shadow:inset 0 0 0 2px var(--deep),inset 0 2px 0 2px rgba(255,255,255,.12),inset 0 -4px 0 2px rgba(0,0,0,.3)}
.events button:active{transform:translateY(2px)}
.radar-bar{border-radius:999px;padding:7px 14px}
.ringhint{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:linear-gradient(180deg,#FFD66B,#FFC93C);color:#2A1E00;font-family:var(--pix);font-size:8.5px;box-shadow:inset 0 0 0 2px var(--deep),0 6px 0 rgba(0,0,0,.3),0 0 18px rgba(255,201,60,.6);animation:ringPop 1s ease-in-out infinite;pointer-events:none;white-space:nowrap}
@keyframes ringPop{50%{transform:translateX(-50%) scale(1.06)}}
.loot-fly{position:absolute;width:30px;height:30px;transform:translate(-50%,-50%) scale(1.3);transition:left .55s cubic-bezier(.5,-.4,.6,1),top .55s cubic-bezier(.5,-.4,.6,1),transform .55s,opacity .55s;z-index:4;pointer-events:none;filter:drop-shadow(0 0 8px #FFC93C)}
#liveCv{cursor:pointer}
/* ---------- tienda: rastros ---------- */
.trailprev{width:100%;height:64px;border-radius:10px;display:block;box-shadow:inset 0 0 0 2px #3D3394;margin:4px 0}
.sitem{border-radius:16px}
.floatbar{bottom:calc(112px + env(safe-area-inset-bottom,0px))!important;border-radius:14px}
@media (prefers-reduced-motion:reduce){.nav .go .nb,.btn.o.big,.btn.g.big,.ringhint,.toast,.screen:not([hidden]){animation:none!important}}

/* manada: varios perros */
.dogrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.dogslot{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:14px;background:#1E1854;box-shadow:inset 0 0 0 2px #3A3088;font-size:12.5px;min-width:0;color:var(--fg)}
.dogslot b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dogslot span{color:var(--mute);font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dogslot em{font-style:normal;font-family:var(--pix);font-size:7px;padding:3px 6px;border-radius:6px;background:var(--mint);color:#04261A}
.dogslot.on{background:linear-gradient(180deg,#3A2F8E,#2A2170);box-shadow:inset 0 0 0 2px #0E0A26,inset 0 0 0 4px var(--coral),0 0 14px var(--glow)}
.dogslot.add{box-shadow:inset 0 0 0 2px #6A5FC8;background:repeating-linear-gradient(45deg,#1E1854 0 8px,#221B5E 8px 16px);justify-content:center;min-height:104px}
.dogslot .plus{font-family:var(--pix);font-size:22px;color:var(--gold)}
.brsearch{margin-bottom:8px}
/* misiones por etapas */
.chainrow{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:8px 0;box-shadow:0 2px 0 rgba(246,234,200,.08)}
.chainrow .mic img{width:28px;height:28px}
.chainrow.ready{background:linear-gradient(90deg,rgba(79,209,139,.14),transparent);border-radius:12px;padding:8px 6px}
.chainrow.done{opacity:.6}
.itcard.miss img{filter:brightness(0) opacity(.5)}
.tag.ceo{background:linear-gradient(180deg,#FFE29A,#FFC93C 55%,#F5A623);color:#2A1E00;box-shadow:inset 0 0 0 2px #0E0A26,0 0 12px rgba(255,201,60,.6);font-weight:800;align-self:flex-start}
/* ===== Ángeles de la manada ===== */
.angelbox{background:linear-gradient(180deg,rgba(159,196,255,.12),rgba(255,201,60,.05));box-shadow:inset 0 0 0 2px rgba(159,196,255,.45)}
.dogslot.ang{background:radial-gradient(circle at 50% 35%,rgba(214,246,255,.22),transparent 70%)}
.dogslot.ang.on{box-shadow:inset 0 0 0 2px #9FC4FF,0 0 14px rgba(159,196,255,.5)}
.angbox{position:relative}
.angfloat{animation:angFloat 2.6s ease-in-out infinite}
@keyframes angFloat{50%{transform:translateY(-4px)}}
.angchip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 3px;background:rgba(159,196,255,.16);box-shadow:inset 0 0 0 2px rgba(159,196,255,.6);color:#D6E6FF;font:inherit;font-size:9px;cursor:pointer;align-self:flex-start}
.angchip img{width:30px;height:27px;image-rendering:pixelated}
.tag.angtrait{background:rgba(159,196,255,.2);color:#D6E6FF}
.angphrase{font-style:italic;color:#D6E6FF;max-width:30ch}
.angwelcome .angbox{filter:drop-shadow(0 0 18px rgba(159,196,255,.7))}
.skycv{width:100%;max-width:300px;aspect-ratio:1;align-self:center;image-rendering:pixelated;box-shadow:inset 0 0 0 2px #2A3470}
.letter{padding:10px;gap:4px}
.angpre{box-shadow:inset 0 0 0 2px rgba(159,196,255,.45)}
@media (prefers-reduced-motion:reduce){.angfloat{animation:none}}
.tag.nat{background:rgba(255,255,255,.1);color:#FFF6D8}.natflag{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}.natsel{appearance:auto}
body{font-synthesis:none;-webkit-font-smoothing:none}
.t1,.logo,.lvbig,.count span,.lvup{font-family:var(--head)}
/* ===== Tarjeta de perfil v2: héroe con fondo, datos ordenados ===== */
.pcard>.pfx{z-index:1!important;opacity:.85;-webkit-mask-image:linear-gradient(180deg,#000 0 34%,rgba(0,0,0,.25) 48%,transparent 62%);mask-image:linear-gradient(180deg,#000 0 34%,rgba(0,0,0,.25) 48%,transparent 62%)}
.pcard .evob{font-size:11px;padding:5px 8px}
.pcard .pc-in{gap:12px}
.pc-top{gap:6px;align-items:center}
.pc-top .row{gap:4px;flex-wrap:wrap;justify-content:flex-end}
.pcard .pc-stage.pc-hero{width:100%;height:200px;display:block;padding:0;box-shadow:inset 0 0 0 3px #0E0A26,inset 0 0 0 5px var(--tc),0 4px 0 #0E0A26;overflow:hidden;cursor:pointer}
.pc-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,10,38,0) 55%,rgba(14,10,38,.35));pointer-events:none;z-index:3}
.pc-hero .pc-dog{position:absolute;left:50%;bottom:8px;width:150px;height:150px;transform:translateX(-50%);display:grid;place-items:end center;z-index:2}
.pc-hero .pc-dog .aura{z-index:0}
.pc-hero .pc-dog .petbox{position:relative;z-index:2}
.pc-hero .pc-shadow{position:absolute;left:50%;bottom:6px;width:96px;height:10px;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(0,0,0,.45),transparent 70%);z-index:1}
.pc-lv{position:absolute;left:10px;top:10px;z-index:4;display:flex;flex-direction:column;align-items:center;padding:6px 8px 7px;background:rgba(14,10,38,.82);box-shadow:inset 0 0 0 2px var(--tc),3px 3px 0 #0E0A26;line-height:1}
.pc-lv span{font-family:var(--pix);font-size:12px;color:var(--mute)}
.pc-lv b{font-family:var(--head);font-size:20px;color:var(--tc);text-shadow:2px 2px 0 var(--tc2);margin-top:3px}
.pc-scene{position:absolute;right:10px;bottom:10px;z-index:4;font-family:var(--pix);font-size:12px;padding:3px 7px;background:rgba(14,10,38,.72);color:#FFF6D8}
.pc-tap{position:absolute;right:10px;top:10px;z-index:4;font-family:var(--pix);font-size:12px;padding:3px 7px;background:rgba(14,10,38,.72);color:var(--tc)}
.pc-id{display:flex;flex-direction:column;gap:6px}
.pc-idrow{display:flex;align-items:center;gap:8px;min-width:0}
.pcard .pcname{font-family:var(--head);font-size:18px;line-height:1.2;color:#FFF6D8;text-shadow:3px 3px 0 #0E0A26;word-break:break-word;min-width:0}
.pc-sex{display:inline-grid;place-items:center;width:26px;height:26px;flex:none;box-shadow:inset 0 0 0 2px currentColor}
.pc-sex.hembra{color:#FF7AB8}.pc-sex.macho{color:#5BB0FF}
.pc-sex svg,.pc-sex img{width:16px;height:16px}
.pc-nat{margin-left:auto;flex:none;font-family:var(--pix);font-size:14px;padding:4px 8px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px rgba(255,255,255,.16)}
.pc-sub{font-size:15px;color:var(--mute)}
.pc-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pc-chips .tag{font-size:13px;padding:4px 8px}
.pc-chips .tag.ceo{align-self:auto}
.pc-chips .angchip{font-size:13px;padding:2px 8px 2px 2px;align-self:auto}
.pc-chips .angchip img{width:26px;height:24px}
.care-btn{font-size:13px!important}
.sex-tag,.fac-tag{font-size:12px!important}
.cv-wx.hol{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}.cv-wx.hol b{font-size:15px;color:#FFE29A}.cv-wx.hol span{font-size:12px;color:#C9BDFF}
.cv-wx{margin-top:8px;align-self:center;font-family:var(--pix);font-size:13px;color:#FFF6D8;padding:4px 10px;background:rgba(14,10,38,.55);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
</style>

      <div class="mapside"><button class="iconbtn" id="zin" aria-label="Acercar">+</button><button class="iconbtn" id="zout" aria-label="Alejar">−</button><button class="iconbtn" id="zme" aria-label="Centrar en mí"></button><button class="iconbtn" id="zstyle" aria-label="Estilo del mapa"></button></div>
      <div class="attr" id="attr1">© OpenStreetMap contributors</div>
      <div class="mapbottom" id="mapBottom"></div>
    </section>
    <section class="screen" id="s-walk" hidden></section>
    <section class="screen" id="s-store" hidden></section>
    <section class="screen" id="s-feed" hidden></section>

  <div class="ov" id="o-live" hidden>
    <div class="livemap">
      <canvas id="liveCv"></canvas>
      <div class="livetop">
        <div class="pill"><span class="rec" id="recDot"></span><span id="liveState">PASEANDO</span></div>
        <div class="pill" id="gpsPill">GPS…</div><div class="pill" id="sniffPill" hidden style="color:#4FD18B">OLFATEO</div>
        <span class="grow"></span>
        <button class="pill" id="lzin" aria-label="Acercar">+</button><button class="pill" id="lzout" aria-label="Alejar">−</button>
        <button class="pill" id="ecoBtn" aria-label="Modo ahorro de batería">AHORRO</button><button class="pill" id="lstyle" aria-label="Estilo del mapa">MAPA</button><button class="pill" id="minBtn" aria-label="Minimizar">▼</button>
      </div>
      <div class="ringhint" id="ringHint" hidden></div><div class="radar-bar" id="radarBar"><span id="radarTxt">📡 ANILLO GPS 55M ACTIVO</span><span id="radarDist" style="color:var(--gold)">BUSCANDO TESOROS</span></div>
      <div class="attr" style="bottom:6px">© OpenStreetMap contributors</div>
    </div>
    <div class="panel">
      <div><div class="lbl" style="text-align:center">Tiempo</div><div class="num bigtime" id="lTime">0:00</div></div>
      <div class="duo"><div><div class="num" id="lDist">0,00</div><div class="lbl">Km</div></div><div><div class="num" id="lPace">-'--"</div><div class="lbl">Ritmo /km</div></div></div>
      <div class="quad">

function installAppLogoIcons(){
  try{
    const im=new Image();
    im.onload=()=>{
      const c=document.createElement('canvas');c.width=180;c.height=180;
      const x=c.getContext('2d');
      x.fillStyle='#17123A';x.fillRect(0,0,180,180);
      x.strokeStyle='#FF7A4D';x.lineWidth=6;x.strokeRect(3,3,174,174);
      const sc=Math.min(156/im.width,156/im.height),w=Math.round(im.width*sc),h=Math.round(im.height*sc);
      x.drawImage(im,Math.round((180-w)/2),Math.round((180-h)/2),w,h);
      const url=c.toDataURL('image/png');
      ['icon','apple-touch-icon'].forEach(rel=>{
        let lk=document.querySelector(`link[rel="${rel}"]`);
        if(!lk){lk=document.createElement('link');lk.rel=rel;document.head.appendChild(lk)}
        lk.href=url;
      });
    };
    im.src=APP_LOGO;
  }catch(e){}
}
installAppLogoIcons();

function shade(hex,a){let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(a<0?v*(1+a):v+(255-v)*a)));return '#'+((1<<24)+(f(r)<<16)+(f(g)<<8)+f(b)).toString(16).slice(1)}
const sprC=new Map(),urlC=new Map();
function paint(rows,pal,w,h){const c=document.createElement('canvas');w=w||Math.max(...rows.map(r=>r.length));h=h||rows.length;c.width=w;c.height=h;const x=c.getContext('2d');rows.forEach((r,j)=>{for(let i=0;i<Math.min(r.length,w);i++){const ch=r[i];if(ch==='.'||ch===' ')continue;const col=(pal&&pal[ch])||PAL[ch];if(!col)continue;x.fillStyle=col;x.fillRect(i,j,1,1)}});return c}
function iconC(name,x){
  const baseName=String(name||'star').split(':')[0];
  let icn=baseName;if(!ICONS[baseName]){try{const it=ITEMS.find(i=>i.id===baseName);if(it&&it.ic){icn=it.ic;if(!x&&it.tint)x=it.tint}}catch(e){}}
  const k=baseName+'|'+(x||'');
  if(!sprC.has(k)){
    const rows=ICONS[icn]||ICONS.star;
    let pal=null;
    if(x==='#1A0A02'||x==='#2A0E04'){
      pal={o:'#2A0E04',w:'#FFF4D6',y:'#5A240E',Y:'#3D1608',r:'#5A240E',R:'#5A240E',p:'#5A240E',b:'#5A240E',g:'#5A240E',G:'#3D1608',B:'#5A240E',D:'#3D1608',s:'#5A240E',S:'#3D1608',c:'#FFF4D6',l:'#5A240E',x};
    }else if(x==='#8A93AD'){
      pal={o:'#120A28',w:'#E6ECFF',y:'#B5C0DE',Y:'#6B7699',r:'#98A4C7',R:'#98A4C7',p:'#98A4C7',b:'#98A4C7',g:'#98A4C7',G:'#6B7699',B:'#98A4C7',D:'#6B7699',s:'#98A4C7',S:'#6B7699',c:'#C8D2EE',l:'#98A4C7',x};
    }else if(x){
      const hi=shade(x,.42),dk=shade(x,-.3);
      pal={o:'#120A28',w:'#FFFFFF',y:hi,Y:dk,r:x,R:x,p:x,b:x,g:x,G:dk,B:x,D:dk,s:hi,S:dk,c:hi,l:x,x};
    }
    sprC.set(k,paint(rows,pal,rows[0].length,rows.length));
  }
  return sprC.get(k);
}
function iconU(name,x){const k='u'+name+'|'+(x||'');if(!urlC.has(k))urlC.set(k,iconC(name,x).toDataURL());return urlC.get(k)}

function rollRarity(extraLuck=0){
  const tLuck=(S&&S.talents&&S.talents.suerte||0)*0.015;
  const bLuck=(S&&S.boosts&&S.boosts.luck>0)?0.04:0;
  const lk=Math.min(0.12,extraLuck+tLuck+bLuck);
  const v=Math.random()*100;
  const pLeg=1+(lk*25);
  const pEpi=4+(lk*45);
  const pRar=12+(lk*70);
  const pInf=28+(lk*50);
  if(v<pLeg)return 'legendaria';
  if(v<pLeg+pEpi)return 'epica';
  if(v<pLeg+pEpi+pRar)return 'rara';
  if(v<pLeg+pEpi+pRar+pInf)return 'infrecuente';
  return 'comun';
}
function rollItem(extraLuck=0){
  const r=rollRarity(extraLuck);
  const base=pickNormal();
  return `${base.id}:${r}`;
}

async function checkGps(){PLAN.checking=true;if(tab==='walk')renderPre();const f=await getFix(15000);PLAN.checking=false;PLAN.gps=f;if(tab==='walk')renderPre();if(f.err&&tab==='walk')gpsFail(f.err,fix=>{PLAN.gps=fix;if(tab==='walk')renderPre()})}

  cand.sort((a,b)=>a.d-b.d||Math.random()-.5);const pick=[];let cur=h0;const pool=cand.slice(0,40);while(pick.length<5&&pool.length){const cx=hexXY(cur);pool.sort((a,b)=>{const A=hexXY(a.k),B=hexXY(b.k);return Math.hypot(A.x-cx.x,A.y-cx.y)-Math.hypot(B.x-cx.x,B.y-cx.y)});const n=pool.shift();pick.push({k:n.k,done:false});cur=n.k}return pick}

function evalHour(h,dp){dp=dp||dogProfile();const R=[];const add=(lvl,i,txt,k)=>R.push({lvl,i,txt,k});const f=h.feels,nm=esc(S.pet.name);
  const hb=32-dp.heatAdj,hw=27-dp.heatAdj,cb=-5+dp.coldAdj,cw=3+dp.coldAdj;
  if(f>=hb)add(2,'thermo',`Calor peligroso: sensación de ${r0(f)}°C. Riesgo de golpe de calor${dp.brachy?' (su raza respira con dificultad con calor)':''}.`,'heat');
  else if(f>=hw)add(1,'thermo',`Calor: sensación de ${r0(f)}°C. Paseo corto, por la sombra y con agua.`,'heat');
  if(f<=cb)add(2,'snowc',`Frío extremo: sensación de ${r0(f)}°C.`,'cold');
  else if(f<=cw)add(1,'snowc',`Frío: sensación de ${r0(f)}°C.${dp.small||dp.young||dp.senior?` Abriga a ${nm}.`:''}`,'cold');
  const pav=pavement(h);
  if(pav>=52)add(2,'paw',`Pavimento a ~${r0(pav)}°C: quema las almohadillas. Camina por pasto o tierra.`,'pave');
  else if(pav>=45)add(1,'paw',`Pavimento caliente (~${r0(pav)}°C). Prueba 7 segundos con el dorso de tu mano.`,'pave');
  const c=h.code;
  if(c>=95)add(2,'storm','Tormenta eléctrica: los truenos asustan y es peligroso estar afuera.','storm');
  else if(h.pr>=4||c===65||c===67||c===82)add(2,'rain',`Lluvia intensa (${(+h.pr).toFixed(1).replace('.',',')} mm/h).`,'rain');
  else if(h.pr>=0.3||(c>=51&&c<=67)||(c>=80&&c<=82)||(h.pp!=null&&h.pp>=60))add(1,'rain',`Lluvia${h.pp!=null?` (${h.pp}% de probabilidad)`:''}. Lleva impermeable y sécalo al volver.`,'rain');
  if((c>=71&&c<=77)||c===85||c===86)add(1,'snowc','Nieve o granizo: revisa sus patas al volver.','snow');
  if(c===45||c===48)add(1,'fog','Niebla: poca visibilidad, usa collar reflectante o luz.','fog');
  if(h.gust>=70)add(2,'wind',`Ráfagas de ${r0(h.gust)} km/h: riesgo de ramas y objetos volando.`,'wind');
  else if(h.gust>=50)add(1,'wind',`Viento fuerte (ráfagas de ${r0(h.gust)} km/h).`,'wind');
  if(h.day&&h.uv>=8)add(1,'sun',`Índice UV ${r0(h.uv)}: evita el sol directo${['#F2E6D0','#9AA3B5'].includes(S.pet.fur)?'; el pelaje claro se quema fácil':''}.`,'uv');
  if(h.aqi!=null){if(h.aqi>150)add(2,'aqi',`Aire contaminado (ICA ${r0(h.aqi)}). Evita el ejercicio afuera.`,'aqi');else if(h.aqi>100)add(1,'aqi',`Calidad del aire regular a mala (ICA ${r0(h.aqi)}). Paseo corto y suave.`,'aqi')}
  const lvl=R.reduce((a,x)=>Math.max(a,x.lvl),0);R.sort((a,b)=>b.lvl-a.lvl);
  return{lvl,R,score:(2-lvl)*10-Math.abs(f-16)/3-(h.pp||0)/40}}
const hh=t=>t.slice(11,16);
function windows(from,to,am){const dp=dogProfile();const out=[];let cur=null;
  for(let i=from;i<to;i++){const h=hourAt(i,am);if(!h)break;const hr=+h.t.slice(11,13);const ok=hr>=6&&hr<=22;const ev=ok?evalHour(h,dp):null;
    if(ev&&ev.lvl<2&&(!cur||cur.lvl===ev.lvl)&&(!cur||cur.date===h.t.slice(0,10))){if(!cur)cur={a:h.t,b:h.t,lvl:ev.lvl,score:0,n:0,date:h.t.slice(0,10)};cur.b=h.t;cur.score+=ev.score;cur.n++}
    else{if(cur)out.push(cur);cur=ev&&ev.lvl<2?{a:h.t,b:h.t,lvl:ev.lvl,score:ev.score,n:1,date:h.t.slice(0,10)}:null}}
  if(cur)out.push(cur);
  return out.map(w=>({...w,avg:w.score/w.n})).sort((x,y)=>x.lvl-y.lvl||y.avg-x.avg||(x.a>y.a?1:-1))}
const endH=t=>{const d=new Date(t);d.setHours(d.getHours()+1);return String(d.getHours()).padStart(2,'0')+':00'};
const dayName=t=>{const d=new Date(t+'T12:00');const td=dkey();if(t===td)return 'Hoy';const tm=new Date();tm.setDate(tm.getDate()+1);if(t===dkey(tm))return 'Mañana';return d.toLocaleDateString('es-CL',{weekday:'short',day:'numeric'})};
function upcomingAlerts(hours=12){if(!WX.d)return[];const am=aqiMap(),dp=dogProfile(),i0=nowIdx(),out=[];const open={};
  for(let i=i0;i<i0+hours;i++){const h=hourAt(i,am);if(!h)break;const ev=evalHour(h,dp);const bad=new Set(ev.R.filter(x=>x.lvl===2).map(x=>x.k));
    for(const x of ev.R.filter(x=>x.lvl===2)){if(open[x.k]){open[x.k].b=h.t}else{open[x.k]={k:x.k,i:x.i,txt:x.txt,a:h.t,b:h.t};out.push(open[x.k])}}
    for(const k in open)if(!bad.has(k))delete open[k]}
  return out}

function wxTips(n,dp,pav){const t=[];

  if(dp.brachy&&n.feels>=22)t.push('Su raza se ahoga con facilidad: paseos cortos y sin correr.');
  if(n.feels<=8)t.push(dp.small||dp.senior||dp.young?'Ponle un abrigo y acorta el paseo.':'Mantén el ritmo para que entre en calor.');
  if(n.code>=51&&n.code<95)t.push('Sécale bien las patas y entre los dedos al volver.');
  if(n.aqi!=null&&n.aqi>100)t.push('Con mala calidad del aire, mejor juegos tranquilos en casa.');
  if(n.code>=95)t.push('Si le asustan los truenos, déjale un lugar tranquilo y cerrado en casa.');
  if(!t.length)t.push('Buen día para un paseo largo: aprovecha de conquistar territorios.');
  return t}

/* ================= GPS ACTIVATION HELPER ================= */
function embedInfo(){let framed=false;try{framed=window.self!==window.top}catch(e){framed=true}let allowed=null;try{const pp=document.permissionsPolicy||document.featurePolicy;if(pp&&pp.allowsFeature)allowed=pp.allowsFeature('geolocation')}catch(e){}return{framed,allowed,url:/^https?:/.test(location.href)?location.href:null}}
const gpsFramedBlocked=()=>{const e=embedInfo();return !inClaude()&&e.framed&&e.allowed===false};
function browserTips(){const ua=navigator.userAgent,ios=/iPhone|iPad|iPod/.test(ua);
  if(/OPR|OPX|OPT|Opera|OPRGX|OPGX/i.test(ua))return['Opera / Opera GX','Toca el ícono a la izquierda de la dirección web → Configuración del sitio → Ubicación → Permitir. Si no aparece: menú → Configuración → Privacidad y seguridad → Configuración de sitios → Ubicación → quita este sitio de “Bloqueados”.'];
  if(/SamsungBrowser/.test(ua))return['Samsung Internet','Menú ≡ → Configuración → Sitios y descargas → Permisos de sitios → Ubicación → permite este sitio.'];
  if(ios&&/CriOS/.test(ua))return['Chrome en iPhone','Ajustes del iPhone → Apps → Chrome → Ubicación → “Mientras se usa la app”. Luego vuelve a PaseoPet.'];
  if(ios)return['Safari en iPhone','Ajustes → Privacidad y seguridad → Localización (activada). Luego Ajustes → Apps → Safari → Ubicación → Preguntar o Permitir.'];
  return['Chrome','Toca el ícono a la izquierda de la dirección web → Permisos → Ubicación → Permitir. Si sale “Bloqueado”, toca “Restablecer permisos” y recarga.']}
let gpsFixOpen=false,gpsFixToken=0;
async function gpsFail(err,onOk){
  const em=embedInfo();
  if(err==='denied'&&em.framed){const st=await gpsPerm();if(em.allowed===false||st!=='denied')err='frame'}
  if(inClaude()&&(err==='denied'||err==='frame'))err='claude';
  const tok=++gpsFixToken;const [bn,bt]=browserTips();
  const finish=fix=>{if(tok!==gpsFixToken||!gpsFixOpen)return;closeSheet();toast('¡GPS activado!','gps','#2CE6A6');onOk&&onOk(fix)};
  let body='',auto='';
  if(err==='frame'){body=`<div class="t1" style="color:var(--gold)">GPS BLOQUEADO POR LA PÁGINA</div><div>PaseoPet se está mostrando dentro de un recuadro de otra página (por ejemplo Wix). Ese recuadro bloquea el GPS aunque los permisos de tu navegador estén activados.</div>
    ${em.url?`<a class="btn o big" href="${esc(em.url)}" target="_blank" rel="noopener">Abrir PaseoPet en pantalla completa</a><div class="mute small">Se abre en una pestaña nueva, con GPS. Desde ahí agrégala a tu pantalla de inicio (menú del navegador → “Agregar a pantalla de inicio”) para usarla como app.</div>`:`<div class="banner small">Esta página no se puede abrir sola. Sube el archivo a un sitio que lo muestre en página completa (Netlify Drop o GitHub Pages) y enlázalo con un botón.</div>`}`}
  else if(err==='claude'){body=`<div class="t1" style="color:var(--gold)">GPS NO DISPONIBLE AQUÍ</div><div>${GPS_MSG.claude}</div>`}
  else if(err==='insecure'){body=`<div class="t1" style="color:var(--gold)">FALTA HTTPS</div><div>${GPS_MSG.insecure}</div>`}
  else if(err==='nogeo'){body=`<div class="t1">SIN GPS</div><div>${GPS_MSG.nogeo}</div>`}
  else if(err==='denied'){auto='perm';body=`<div class="t1" style="color:var(--gold)">ACTIVA LA UBICACIÓN</div><div>El permiso de ubicación de este sitio está bloqueado. Actívalo así (${esc(bn)}):</div><div class="box dark small">${esc(bt)}</div><div class="row small"><span class="rec" style="background:var(--mint)"></span><span id="gfAuto">Cuando lo actives, PaseoPet lo detecta sola y sigue.</span></div>`}
  else{auto='poll';body=`<div class="t1" style="color:var(--gold)">ENCIENDE LA UBICACIÓN</div><div>No llega señal de GPS. Lo más común es que la ubicación del teléfono esté apagada.</div><div class="box dark small"><b>Rápido:</b> desliza desde arriba de la pantalla y toca <b>Ubicación</b>.<br><b>Android:</b> Ajustes → Ubicación → activa “Precisión de ubicación de Google”.<br><b>iPhone:</b> Ajustes → Privacidad y seguridad → Localización.<br>Luego sal a un lugar abierto.</div><div class="row small"><span class="rec" style="background:var(--mint)"></span><span id="gfAuto">Buscando señal automáticamente…</span></div>`}
  sheet(`${body}<div class="g2"><button class="btn g" id="gfRetry">Reintentar</button><button class="btn" id="gfClose">Cerrar</button></div>${tab==='walk'?'<button class="btn v" id="gfManual">Registrar paseo manual</button>':''}`,sh=>{gpsFixOpen=true;
    sh.querySelector('#gfClose').onclick=closeSheet;const mb=sh.querySelector('#gfManual');if(mb)mb.onclick=()=>{closeSheet();openManual()};
    sh.querySelector('#gfRetry').onclick=async e=>{e.currentTarget.textContent='…';const f=await getFix(12000);if(!f.err)finish(f);else{const b=sh.querySelector('#gfRetry');if(b)b.textContent='Reintentar';const a=sh.querySelector('#gfAuto');if(a)a.textContent='Aún sin ubicación. Revisa los pasos y vuelve a intentar.'}}});
  if(auto==='perm'){try{const st=await navigator.permissions.query({name:'geolocation'});st.onchange=async()=>{if(st.state!=='denied'&&tok===gpsFixToken&&gpsFixOpen){const f=await getFix(12000);if(!f.err)finish(f)}}}catch(e){}}
  if(auto==='poll'){for(let i=0;i<12;i++){await sleep(6000);if(tok!==gpsFixToken||!gpsFixOpen)return;const f=await getFix(8000);if(!f.err){finish(f);return}const a=$('#gfAuto');if(a)a.textContent=`Buscando señal automáticamente… (intento ${i+2})`}}
}

const SHARE_HINT={ig:'En el menú, elige Instagram → Historias.',wa:'En el menú, elige WhatsApp → Mi estado o un chat.',tt:'En el menú, elige TikTok → Historia o Foto.',more:'Elige dónde compartir.'};
function shareText(rec){return rec&&rec.dist?`${S.pet.name} caminó ${fmtKm(rec.dist)} km en ${fmtTime(rec.time)} con PaseoPet 🐾`:`${S.pet.name} en PaseoPet 🐾`}
async function makeStoryBlob(rec,photoUrl){const saved={...CARD,show:{...CARD.show}};
  CARD.rec=rec||{date:dkey(),dist:0,time:0,moving:0,pts:[],items:[],xp:0};CARD.fmt='9:16';CARD.sticker=false;CARD.pix=true;
  if(!rec){CARD.tpl='solo';CARD.show={dist:false,time:false,pace:false,pet:true}}else if(!CARD.tpl)CARD.tpl='arcade';
  CARD.img=null;if(photoUrl)CARD.img=await new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=photoUrl});
  try{document.fonts&&await withTimeout(document.fonts.load('16px "Press Start 2P"'),2000)}catch(e){}
  const cv=document.createElement('canvas');drawCard(cv);Object.assign(CARD,saved);
  return await new Promise(r=>cv.toBlob(b=>r(b),'image/png'))}
async function shareBlob(blob,app,text){const file=new File([blob],'paseopet-historia.png',{type:'image/png'});const data={files:[file]};if(app==='wa'||app==='more')data.text=text;
  let can=false;try{can=!!(navigator.canShare&&navigator.canShare(data))}catch(e){}
  if(!can&&data.text){delete data.text;try{can=!!(navigator.canShare&&navigator.canShare(data))}catch(e){}}
  if(!can)return false;toast(SHARE_HINT[app],'megafono');try{await navigator.share(data)}catch(e){if(e&&e.name==='AbortError')return 'cancel';return false}return true}
async function saveBlob(blob,name){if(DOWN===undefined)DOWN=inClaude()?await withTimeout(window.claude.use('downloads'),4000):null;
  if(DOWN){try{await DOWN.save({filename:name,data:blob});toast('Imagen guardada en tu galería o descargas','cam');return true}catch(e){if(e&&e.code==='declined')return true}}
  if(!inClaude()){try{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Imagen descargada','cam');return true}catch(e){}}
  return false}
async function openStory(rec,photoUrl){toast('Preparando tu historia…','cam');const blob=await makeStoryBlob(rec,photoUrl);openShareSheet(blob,rec,photoUrl)}
function openShareSheet(blob,rec,photoUrl){const url=URL.createObjectURL(blob);const text=shareText(rec);const name=`paseopet-${(rec&&rec.date)||dkey()}.png`;

   const go2=app=>async()=>{const ok=await shareBlob(blob,app,text);if(!ok)fallback(app)};
   sh.querySelector('#shIg').onclick=go2('ig');sh.querySelector('#shWa').onclick=go2('wa');sh.querySelector('#shTt').onclick=go2('tt');sh.querySelector('#shMore').onclick=go2('more');

function wxIcon24C(kind){
  const k='wx24|'+kind;if(sprC.has(k))return sprC.get(k);
  const G=Array.from({length:24},()=>Array(24).fill(null));
  const set=(x,y,v)=>{if(x>=0&&x<24&&y>=0&&y<24)G[y][x]=v};
  const ell=(cx,cy,rx,ry,v)=>{for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){if(((x+.5-cx)/rx)**2+((y+.5-cy)/ry)**2<=1)set(x,y,v)}};
  const drawSun=(cx,cy,r)=>{
    const rays=[[0,-r-3],[0,-r-2],[0,r+2],[0,r+3],[-r-3,0],[-r-2,0],[r+2,0],[r+3,0],[-r-1,-r-1],[r+1,-r-1],[-r-1,r+1],[r+1,r+1]];
    rays.forEach(([dx,dy])=>set(cx+dx,cy+dy,'#FFB82E'));
    ell(cx,cy,r+0.4,r+0.4,'#FF881B');
    ell(cx,cy,r-0.6,r-0.6,'#FFD438');
    ell(cx-1,cy-1,r-2.2,r-2.2,'#FFF7C2');
  };
  const drawMoon=(cx,cy,r)=>{
    for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){
      const d1=x*x+y*y,d2=(x-3)*(x-3)+(y+2)*(y+2);
      if(d1<=r*r&&d2>(r-1)*(r-1)){
        set(cx+x,cy+y,x+y>3?'#D9B252':x+y<-2?'#FFF8D6':'#FFE28A');
      }
    }
    [[3,4],[19,5],[5,18],[18,16]].forEach(([sx,sy],i)=>{set(sx,sy,i%2?'#FFF8D6':'#5CE1FF')});
  };
  const drawCloud=(ox,oy,dark)=>{
    const cTop=dark?'#9EB2D4':'#FFFFFF',cMid=dark?'#7489AD':'#DCE6F7',cBot=dark?'#4D5F82':'#9EB2D4';
    ell(ox+7,oy+5,4.2,3.6,cMid);ell(ox+12,oy+3.5,5,4.5,cTop);ell(ox+16.5,oy+5.5,3.8,3.2,cMid);
    for(let y=oy+5;y<=oy+8;y++)for(let x=ox+3;x<=ox+19;x++)set(x,y,y>=oy+7?cBot:cMid);
    ell(ox+11,oy+2.5,3.2,2.2,cTop);
  };
  if(kind==='sun')drawSun(11,11,6);
  else if(kind==='moon')drawMoon(12,11,7);
  else if(kind==='partly'){drawSun(8,8,5);drawCloud(2,8,false)}
  else if(kind==='partlyNight'){drawMoon(9,8,5);drawCloud(2,9,false)}
  else if(kind==='cloud'){drawCloud(3,4,true);drawCloud(0,8,false)}
  else if(kind==='rain'){
    drawCloud(1,3,true);
    [[6,15],[5,16],[4,17],[11,15],[10,16],[9,17],[16,15],[15,16],[14,17],[8,19],[7,20],[13,19],[12,20]].forEach(([x,y],i)=>set(x,y,i%3===0?'#A8E6FF':'#3C9DFF'));
  }else if(kind==='storm'){
    drawCloud(1,2,true);
    [[12,12],[13,12],[11,13],[12,13],[10,14],[11,14],[10,15],[11,15],[12,15],[13,15],[11,16],[12,16],[10,17],[11,17],[9,18],[10,18],[9,19]].forEach(([x,y])=>set(x,y,x===11?'#FFF7C2':'#FFC93C'));
    [[5,15],[4,16],[17,15],[16,16],[6,19],[16,19]].forEach(([x,y])=>set(x,y,'#3C9DFF'));
  }else if(kind==='snowc'){
    drawCloud(1,3,false);
    [[6,16],[5,16],[7,16],[6,15],[6,17],[12,18],[11,18],[13,18],[12,17],[12,19],[17,15],[16,15],[18,15],[17,14],[17,16]].forEach(([x,y])=>set(x,y,(x+y)%2?'#FFFFFF':'#8CE0FF'));
  }else{
    drawCloud(1,3,true);
    for(const [y,x0,x1,col] of [[14,3,20,'#DCE6F7'],[16,5,21,'#9EB2D4'],[18,2,18,'#DCE6F7'],[20,6,19,'#7489AD']])for(let x=x0;x<=x1;x++)set(x,y,col);
  }
  const O=G.map(r=>r.slice());
  for(let y=0;y<24;y++)for(let x=0;x<24;x++)if(!G[y][x]&&[[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>(G[y+b]||[])[x+a]))O[y][x]='#120C2B';
  const c=document.createElement('canvas');c.width=24;c.height=24;const ctx=c.getContext('2d');
  O.forEach((r,y)=>r.forEach((v,x)=>{if(v){ctx.fillStyle=v;ctx.fillRect(x,y,1,1)}}));
  sprC.set(k,c);return c;
}

function calcWalkCoins(w,terr,wb,parkRes,firstToday,misDone,streak){

  if(distC>0)parts.push([`Distancia (${fmtKm(w.dist)} km · 1 c/250m)`,`+${distC}`]);
  const timeC=Math.floor((w.moving||w.time||0)/600);
  if(timeC>0)parts.push([`Tiempo en marcha (1 c/10 min)`,`+${timeC}`]);
  const terrC=Math.min(6,Math.floor(((terr&&terr.taken)||0)/2));
  if(terrC>0)parts.push([`Territorios conquistados (${terr.taken})`,`+${terrC}`]);

  if(sniffC>0)parts.push([`Paradas de olfateo (${wb.sniffN})`,`+${sniffC}`]);
  const happyC=wb&&wb.happy>=85&&(w.moving||0)>=600?3:wb&&wb.happy>=70&&(w.moving||0)>=600?1:0;
  if(happyC>0)parts.push([`Paseo feliz (${wb.happy}%)`,`+${happyC}`]);
  const itemC=(w.got||[]).reduce((a,g)=>a+(COINV[itemById(g).r]||1),0);
  if(itemC>0)parts.push([`Objetos recogidos (${w.got.length})`,`+${itemC}`]);
  const parkC=Math.min(4,(parkRes||[]).length*2);
  if(parkC>0)parts.push([`Parques explorados (${parkRes.length})`,`+${parkC}`]);
  const firstC=firstToday&&(w.moving||w.time||0)>=600?3:0;
  if(firstC>0)parts.push([`Primer paseo del día (+10 min)`,`+${firstC}`]);
  const misC=(misDone||[]).reduce((a,m)=>a+(m.coins||3),0);
  if(misC>0)parts.push([`Misiones cumplidas (${misDone.length})`,`+${misC}`]);
  let sub=distC+timeC+terrC+sniffC+happyC+itemC+parkC+firstC+misC;
  const mult=streak>=30?1.3:streak>=7?1.15:1;
  if(mult>1&&sub>0){const extra=Math.max(1,Math.round(sub*(mult-1)));sub+=extra;parts.push([`Bono de racha (${streak} días · x${String(mult).replace('.',',')})`,`+${extra}`])}

}

function buyStoreItem(kind,item){

    const ok=sh.querySelector('#stBuyOk');
    if(ok)ok.onclick=()=>{
      S.coins-=item.price;
      if(kind==='boost'){
        S.boosts=S.boosts||{};
        if(item.id==='escudo'){S.boosts.escudo=(S.boosts.escudo||0)+1}
        else{S.boosts[item.id]=(S.boosts[item.id]||0)+1}
        save();coinSfx();closeSheet();
        toast(`¡${item.n} activado en tu inventario!`,'star','#2CE6A6');
        boom(60);if(tab==='store')renderStore();return;
      }
      if(!owned(key))S.owned=(S.owned||[]).concat([key]);
      if(kind==='skin')S.pet.skin=item.id;
      if(kind==='aura')S.pet.aura=item.id;
      if(kind==='acc')S.pet.acc=item.id;

  for(const id in SECRET_RULES){let ok=false;try{ok=SECRET_RULES[id](w,c)}catch(e){}if(!ok)continue;const it=ITEMS.find(i=>i.id===id);out.push(`${id}:${it.award||'epica'}`);if(!S.found[id]){S.found[id]=dkey();fresh.push(it)}}
  fresh.forEach((it,i)=>setTimeout(()=>{toast(`🔓 ¡SECRETO DESCUBIERTO! ${esc(it.n)}`,it.id,'#FFC93C');boom(110);try{bark(2,.8);grabSfx(5)}catch(e){}},2400+i*1800));
